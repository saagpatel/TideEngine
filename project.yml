name: TideEngine
options:
  bundleIdPrefix: com.tideengine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: 1  # iPhone only

targets:
  TideEngine:
    type: application
    platform: iOS
    sources:
      - TideEngine
    resources:
      - path: TideEngine/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 3TGZFKFNA4
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tide Engine uses your location to show real-time tides for your nearest coastline."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: TideEngine/TideEngine.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "TideEngine App Store"
    entitlements:
      path: TideEngine/TideEngine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tideengine
    dependencies:
      - target: TideEngineWidget
        embed: true
        codeSign: true

  TideEngineWidget:
    type: app-extension
    platform: iOS
    sources:
      - TideEngineWidget
      - path: TideEngine/Tides/TideModels.swift
      - path: TideEngine/Tides/TideCache.swift
      - path: TideEngine/Ephemeris/Types.swift
      - path: TideEngine/Ephemeris/Ephemeris.swift
      - path: TideEngine/Ephemeris/TidalForce.swift
    settings:
      base:
        INFOPLIST_FILE: TideEngineWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tideengine.TideEngine.widget
        CODE_SIGN_ENTITLEMENTS: TideEngineWidget/TideEngineWidget.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "TideEngine Widget App Store"
        DEVELOPMENT_TEAM: 3TGZFKFNA4
    entitlements:
      path: TideEngineWidget/TideEngineWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tideengine

  TideEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TideEngineTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TideEngine
