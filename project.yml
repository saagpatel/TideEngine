name: TideEngine
options:
  bundleIdPrefix: com.tideengine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TideEngine:
    type: application
    platform: iOS
    sources:
      - TideEngine
    resources:
      - path: TideEngine/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tideengine.app
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 3TGZFKFNA4
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Tide Engine uses your location when you ask it to find a nearby NOAA tide station."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: TideEngine/TideEngine.entitlements
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: TideEngine/TideEngine.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tideengine
    dependencies:
      - target: TideEngineWidget
        embed: true
        codeSign: true

  TideEngineWidget:
    type: app-extension
    platform: iOS
    sources:
      - TideEngineWidget
      - path: TideEngine/Tides/TideModels.swift
      - path: TideEngine/Tides/TideCache.swift
      - path: TideEngine/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: TideEngine/Ephemeris/Types.swift
      - path: TideEngine/Ephemeris/Ephemeris.swift
      - path: TideEngine/Ephemeris/TidalForce.swift
    settings:
      base:
        INFOPLIST_FILE: TideEngineWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tideengine.app.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: TideEngineWidget/TideEngineWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3TGZFKFNA4
    entitlements:
      path: TideEngineWidget/TideEngineWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tideengine

  TideEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TideEngineTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TideEngine
