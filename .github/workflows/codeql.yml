name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: swift
      - run: |
          # CodeQL analyzes Swift only. Ordinary CI compiles Shaders.metal; the
          # hosted CodeQL environment does not include the optional Metal toolchain.
          xcodebuild build \
            -scheme TideEngine \
            -project TideEngine.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            EXCLUDED_SOURCE_FILE_NAMES=Shaders.metal \
            CODE_SIGNING_ALLOWED=NO
      - uses: github/codeql-action/analyze@v4.37.4
