name: CodeQL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
      - uses: github/codeql-action/analyze@v4
